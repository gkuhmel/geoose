<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geoose">
<meta name="theme-color" content="#5fb3e0">
<title>Geoose</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<svg id="map"></svg>

<div id="hud">
  <div id="topbar">
    <div class="tbleft">
      <button id="homebtn" class="glass round" aria-label="Menu">🏠</button>
      <button id="soundbtn" class="glass round sound" aria-label="Son">🔊</button>
    </div>
    <div class="pill glass"><span id="rlabel">1/10</span><span id="dots"></span></div>
    <div class="pill glass" id="score"><span id="clock">⏱️ 15</span> <span id="scoreval">⭐ 0</span></div>
  </div>
  <div id="qcard" class="glass">
    <div id="turn" hidden></div>
    <div id="qlabel">Trouve le pays</div>
    <div id="qname" title="Toucher pour réécouter">…</div>
    <div id="qhint"></div>
    <button id="hintbtn" hidden>💡 Indice (points ÷ 2)</button>
    <div id="timer"></div>
  </div>
</div>

<div id="tip">👆 Touche la carte pour poser l'oie · fais-la glisser pour viser juste</div>
<div id="toast"></div>

<div id="zoombtns">
  <button id="zin" class="glass">＋</button>
  <button id="zout" class="glass">－</button>
  <button id="zworld" class="glass">🌍</button>
</div>

<div id="bottom">
  <div id="result" class="glass">
    <div id="rstamp"></div>
    <div id="rtop"><span id="rflag"></span><span id="rmsg"></span></div>
    <div id="rpts"></div>
    <div id="rbonus"></div>
    <div id="rdetail"></div>
    <div id="rfact"><b>💡 Le savais-tu ?</b> <span id="rfacttxt"></span> <button id="rfactsay" class="say" aria-label="Écouter">🔊</button></div>
  </div>
  <button class="btn" id="go" disabled>Valider 🎯</button>
</div>

<div class="screen" id="home">
  <div class="homewrap">
  <div class="brand"><span class="globe">🪿</span><span class="logo">Ge<span>oo</span>se</span></div>
  <div class="panel glass">
    <div class="group"><h3>Je cherche</h3>
      <div class="choices" data-k="mode">
        <button class="choice on" data-v="pays"><span class="e">🗺️</span>Pays</button>
        <button class="choice" data-v="capitale"><span class="e">🏛️</span>Capitales</button>
        <button class="choice" data-v="drapeau"><span class="e">🚩</span>Drapeaux</button>
        <button class="choice" data-v="mix"><span class="e">🎲</span>Mélange</button>
      </div></div>
    <div class="group"><h3>Où ?</h3>
      <div class="choices wrap inline" data-k="cont" id="conts"></div></div>
    <div class="group"><h3>Niveau</h3>
      <div class="choices" data-k="level">
        <button class="choice on" data-v="1" title="les célèbres"><span class="e">🐣</span>Facile</button>
        <button class="choice" data-v="2" title="assez connus"><span class="e">🦊</span>Moyen</button>
        <button class="choice" data-v="3" title="moins connus"><span class="e">🦅</span>Difficile</button>
        <button class="choice" data-v="4" title="les raretés"><span class="e">🐉</span>Expert</button>
      </div></div>
    <div class="row2">
      <div class="group"><h3>Partie</h3>
        <div class="choices inline" data-k="chrono">
          <button class="choice on" data-v="0"><span class="e">🧭</span>Calme</button>
          <button class="choice" data-v="1"><span class="e">⏱️</span>Chrono</button>
        </div></div>
      <div class="group"><h3>Joueurs</h3>
        <div class="choices inline" data-k="players">
          <button class="choice on" data-v="1"><span class="e">🙂</span>Solo</button>
          <button class="choice" data-v="2"><span class="e">👥</span>À deux</button>
        </div></div>
    </div>
    <div id="names" hidden>
      <label class="name p1"><span>🪿</span><input id="name1" maxlength="12" autocomplete="off" spellcheck="false"></label>
      <label class="name p2"><span>🪿</span><input id="name2" maxlength="12" autocomplete="off" spellcheck="false"></label>
    </div>
    <button class="btn" id="startbtn">C'est parti ! 🚀<small id="best"></small></button>
    <div class="tools">
      <button class="tool" id="learnbtn"><span class="e">📚</span>Révisions<small id="learnn"></small></button>
      <button class="tool" id="passbtn"><span class="e">🛂</span>Passeport<small id="passn"></small></button>
      <button class="tool sq sound" id="soundhome" aria-label="Sons">🔊<small>Sons</small></button>
      <button class="tool sq voice" id="voicehome" aria-label="Lecture des questions">🗣️<small>Voix</small></button>
    </div>
  </div>
  </div>
</div>

<div class="screen hidden" id="passport">
  <div class="panel glass passpanel">
    <div class="passhead">
      <div><div class="ptitle">🛂 Mon passeport</div><div id="ptotal"></div></div>
      <button class="glass round" id="passclose" aria-label="Fermer">✕</button>
    </div>
    <div class="ptabs" id="ptabs"></div>
    <div class="plegend"><span>★ une étoile par mode réussi</span><button id="pmapbtn">🗺️ Voir sur la carte</button></div>
    <div id="pgrid"></div>
  </div>
</div>

<div class="screen hidden" id="end">
  <div class="panel glass">
    <div id="endtitle" style="font-size:28px;font-weight:800">Partie terminée !</div>
    <div class="stars" id="stars"></div>
    <div class="bigscore" id="final">0</div>
    <div id="duel"></div>
    <div style="color:var(--muted);font-weight:700" id="outof">points sur 10 000</div>
    <div id="newbest" style="font-weight:800;color:var(--good-d);min-height:26px;font-size:18px"></div>
    <div id="newstamps"></div>
    <div id="recap"></div>
    <div class="stack">
      <button class="btn" id="againbtn">Rejouer 🔁</button>
      <button class="btn ghost" id="menubtn">Menu</button>
    </div>
  </div>
</div>
<div id="pmapbar" class="glass" hidden>
  <div class="pmtop">
    <div><b id="pmapn"></b><small>Touche un pays pour voir son tampon</small></div>
    <button class="btn small" id="pmapback">📖 Passeport</button>
  </div>
  <div id="pmaplegend"></div>
</div>
<div id="pmapcard" class="glass" hidden></div>
<canvas id="confetti"></canvas>

<script type="module" src="/src/main.js"></script>
</body>
</html>
